<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · First Tuesday List</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.auth{max-width:620px;margin:48px auto 0}
.auth h1{font-size:52px;margin:6px 0 10px}
.auth .card{padding:26px;display:flex;flex-direction:column;gap:14px}
.steps{margin:0;padding-left:20px;line-height:1.8;color:#24324A}
</style>
</head>
<body data-page="welcome">
<main class="wrap auth">
<div class="eyebrow" id="eb">Confirming your payment…</div>
<h1 class="disp" id="h">One moment</h1>
<div class="card" id="c"><p style="margin:0;color:#3A4A63">We're checking with Stripe. This takes a second or two.</p></div>
</main>
<script src="/config.js"></script>
<script src="/assets/site.js?v=2"></script>
<script>
(async function () {
  const id = new URLSearchParams(location.search).get('session_id');
  const set = (eb, h, html) => { document.getElementById('eb').textContent = eb; document.getElementById('h').textContent = h; document.getElementById('c').innerHTML = html; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  if (!id) { location.replace('/members'); return; }
  try {
    const r = await fetch('/api/claim', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: id }) });
    const d = await r.json();
    history.replaceState(null, '', '/welcome');
    if (!r.ok) {
      set('Welcome', d.expired ? 'Sign in to continue' : 'Almost there', `<p style="margin:0">${esc(d.error)}</p><a class="btn btn-red" href="/signin">Sign in with your email</a>`);
      return;
    }
    // the header was drawn before this browser was signed in
    await FTL.status;
    const sl = document.querySelector('.signin-link'); if (sl) sl.remove();
    const cta = document.querySelector('.site-header .cta'); if (cta) { cta.textContent = 'Member home'; cta.href = '/members'; cta.className = 'btn btn-navy cta'; }
    set(d.founding ? 'Founding member' : 'Member', "You're a member", `
      <p style="margin:0;color:#3A4A63">Thanks for joining. You're signed in on this device, and we emailed a sign-in link to <strong>${esc(d.email)}</strong> for your other devices.</p>
      <ol class="steps"><li>Open the map: every property now shows its value, estimated equity and loan.</li><li>Download the member spreadsheet for the sale.</li><li>Read the Top 10 Research Brief before sale day.</li></ol>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn btn-red" href="/members">Go to your member home</a><a class="btn btn-ghost" href="/map">Open the map</a></div>
      <p style="margin:0;font-size:13px;color:var(--muted)">Your receipt comes from Stripe. Manage or cancel anytime from your member home.</p>`);
  } catch (e) {
    set('Welcome', 'Almost there', '<p style="margin:0">We could not confirm your payment just now. If you were charged, sign in with your email: your membership is active.</p><a class="btn btn-red" href="/signin">Sign in</a>');
  }
})();
</script>
</body>
</html>
